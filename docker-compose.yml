services:
  mongo:
    image: mongo:4.4
    container_name: lamimi_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' || mongo --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lamimi_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lamimi_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: lamimi_production
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - lamimi_net

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: lamimi_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - lamimi_net

  nginx:
    image: nginx:alpine
    container_name: lamimi_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/uploads:/var/www/uploads:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    networks:
      - lamimi_net

networks:
  lamimi_net:
    name: lamimi_net
    driver: bridge

volumes:
  mongo_data:
  certbot_conf:
  certbot_www: